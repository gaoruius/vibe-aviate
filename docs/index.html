<!doctype html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="styles.css?v=6">

</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="VibeAviate home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
      <span>Vibe<b>Aviate</b></span>

    <button class="theme-toggle" type="button" aria-label="Theme">◐</button>
    <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <nav class="nav" aria-label="Main">
      <a href="#/home" data-nav="home">Home</a>
      <a href="#/lookup" data-nav="lookup">Lookup</a>

    <span>CIS 51 · Vibe Coding Assignment · Rui Gao (20731015)</span>

  <datalist id="airline-codes"></datalist>
  <datalist id="airport-codes"></datalist>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
